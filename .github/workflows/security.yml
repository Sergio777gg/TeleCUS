name: Security and regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:architecture
      - run: npm test
      - run: npm run test:security
      - run: npm audit --audit-level=moderate
# Real Ollama probes run explicitly on a trusted local machine; CI uses no model credentials.
