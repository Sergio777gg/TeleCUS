# Template: replace the domain and certificate paths before nginx -t.
server {
    listen 80;
    server_name telecus.universidad.example;
    return 301 https://telecus.universidad.example$request_uri;
}

server {
    listen 443 ssl;
    server_name telecus.universidad.example;
    ssl_certificate /etc/ssl/telecus/fullchain.pem;
    ssl_certificate_key /etc/ssl/telecus/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log off;

    # Only receipt multipart bodies need more than the normal JSON limit.
    location ~ ^/api/payments/[^/]+/receipt$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
    }

    # Nest serves the existing compiled React front and /api on the same origin.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
